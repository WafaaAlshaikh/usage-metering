services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: metering
      POSTGRES_DB: metering
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering -d metering"]
      interval: 2s
      timeout: 3s
      retries: 30

  service:
    build: ./service
    environment:
      DATABASE_URL: postgres://metering:metering@db:5432/metering
      PORT: "3000"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  # The example client is added here when it is written.

volumes:
  pgdata: